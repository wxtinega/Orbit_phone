name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.TI_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ti.jks"
            echo "TI_KEYSTORE_FILE=$RUNNER_TEMP/ti.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key secret: building with a debug key (cannot update installed copies)."
          fi

      - name: Build release APK
        env:
          TI_KEY_PASSWORD: ${{ secrets.TI_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk OrbitDial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitDial-apk
          path: OrbitDial.apk

  # Installs the app on an Android emulator, simulates calls, and saves screenshots
  # to the "ui-shots" branch so the design can be checked on a real Android system.
  ui-check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OrbitDial-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui-check.sh

      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p shots
          cd shots
          git init -q
          git checkout -q -b ui-shots
          git add -A
          git -c user.name="Orbit Dial CI" -c user.email="ci@users.noreply.github.com" commit -q -m "UI check for ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ui-shots

  # After the emulator check, publish the APK as a public download anyone can install:
  # https://github.com/wxtinega/Orbit_phone/releases/download/app/TI-Dial.apk
  publish:
    needs: ui-check
    if: github.repository == 'wxtinega/Orbit_phone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OrbitDial-apk

      - name: Publish download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_KEY: ${{ secrets.TI_KEYSTORE != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "Signing key not set up, skipping publish."; exit 0; fi
          cp OrbitDial.apk TI-Dial.apk
          version=$(grep versionName app/build.gradle | grep -o '"[^"]*"' | tr -d '"')
          notes="T.I Dial $version for Android 8 and newer.

          Install: open https://github.com/${{ github.repository }}/releases/download/app/TI-Dial.apk on your phone, open the downloaded file, allow installs from your browser if asked, then tap Install. Open T.I Dial and set it as your default phone app when asked.

          Updates: download the same link again and tap Update."
          if gh release view app > /dev/null 2>&1; then
            gh release upload app TI-Dial.apk --clobber
            gh release edit app --title "T.I Dial $version" --notes "$notes"
          else
            gh release create app TI-Dial.apk --target "$GITHUB_SHA" --title "T.I Dial $version" --notes "$notes" --latest
          fi
