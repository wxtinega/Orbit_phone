plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbitdial.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.orbitdial.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so the release APK installs straight away.
            // For Play Store publishing, replace this with your own keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party libraries: the app uses only the Android framework.
