plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbitdial.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.orbitdial.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.0"
    }

    signingConfigs {
        // One fixed key, so every new build installs over the last one without uninstalling.
        orbit {
            storeFile file('orbit-release.jks')
            storePassword 'orbitdial-release'
            keyAlias 'orbit'
            keyPassword 'orbitdial-release'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.orbit
        }
        debug {
            signingConfig signingConfigs.orbit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third-party libraries: the app uses only the Android framework.
