plugins {
    id 'com.android.application'
}

android {
    namespace 'com.orbitdial.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.orbitdial.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.1"
    }

    // The release key lives only in this repository's GitHub secrets, never in the code,
    // so only the owner's builds can be installed as updates. Builds without it (forks) use a debug key.
    def keyFile = System.getenv('TI_KEYSTORE_FILE')
    signingConfigs {
        if (keyFile) {
            tidial {
                storeFile file(keyFile)
                storePassword System.getenv('TI_KEY_PASSWORD')
                keyAlias 'tidial'
                keyPassword System.getenv('TI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig keyFile ? signingConfigs.tidial : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No third-party libraries: the app uses only the Android framework.
